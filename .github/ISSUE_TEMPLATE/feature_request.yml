name: Feature request
description: Suggest a new command, option or capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search [existing issues](https://github.com/laurentvandelle/n8nlift/issues) first. Multi-environment support, plan and drift detection are already on the roadmap.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like n8nlift to behave. A sample command or code snippet helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
