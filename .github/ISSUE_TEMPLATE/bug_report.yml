name: Bug report
description: Something in n8nlift does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/laurentvandelle/n8nlift/issues) first.
        Do not report security vulnerabilities here. See [SECURITY.md](https://github.com/laurentvandelle/n8nlift/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran and a minimal workflow or config that shows the problem.
      placeholder: |
        1. n8nlift ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full command output or error. Remove API keys, URLs and other secrets first.
      render: shell
  - type: input
    id: n8nlift-version
    attributes:
      label: n8nlift version
      description: Output of `n8nlift --version`.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true
  - type: input
    id: n8n-version
    attributes:
      label: n8n version
      description: The version of the n8n instance you deliver to, if relevant.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11...
